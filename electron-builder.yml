# Packaging — OSADE.md §18.1.
#
# What a packaged Osade has to contain, and why each piece is here:
#
#   - the Electron app itself (main, preload, renderer)
#   - the **daemon**, as built JavaScript, plus its node_modules — `better-sqlite3` is native and
#     cannot be bundled, so it ships as files
#   - a **Node runtime**, because the daemon cannot run on Electron's. `better-sqlite3` is built
#     for one ABI (NODE_MODULE_VERSION 127 for Node 22, 130 for Electron 33) and the daemon also
#     runs under the CLI and the tests. One runtime, one build. See scripts/fetch-node-runtime.mjs
#   - the **herdr** binary, which Osade supervises
#
# Nothing here signs anything. Code signing needs certificates this repo does not and should not
# contain; `CSC_LINK`/`CSC_KEY_PASSWORD` (and the notarize variables on macOS) are read from the
# environment by electron-builder when they are set. An unsigned build is fine to test and not
# fine to hand to a user — Gatekeeper and SmartScreen will both refuse it.

appId: dev.osade.app
productName: Osade
copyright: Copyright © 2026 Osade contributors

directories:
  output: release
  buildResources: build

# The app itself. `files` is relative to the electron app directory.
files:
  - apps/desktop/dist/**/*
  - package.json
  - '!**/*.map'

# Everything the app spawns rather than imports. These stay as real files on disk because they
# are executed, not required.
extraResources:
  # The daemon: built JS plus the native module it cannot bundle.
  - from: packages/daemon/dist
    to: daemon
  - from: packages/daemon/node_modules/better-sqlite3
    to: daemon/node_modules/better-sqlite3
    filter:
      - '**/*'
      - '!**/deps/**'
      - '!**/src/**'
      - '!**/*.md'

  # The `osade` command, for people who drive it from a terminal (§17 — same surface as the UI).
  - from: packages/cli/dist
    to: cli

  # herdr, and the notices its licence requires travel with it.
  - from: vendor/herdr/0.8.2-p20
    to: herdr
    filter:
      - LICENSE
      - RUST-CRATES.md
      - third-party/**
      - '*/herdr*'

  # The runtime the daemon runs on. Populated by scripts/fetch-node-runtime.mjs.
  - from: vendor/node/${platform}-${arch}
    to: node

win:
  target:
    - target: nsis
      arch: [x64]
  # SmartScreen reputation is earned by a signed binary. Unsigned builds will warn.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # §2.2 — Osade keeps its state in ~/.osade, never in ~/Library/Application Support.
  extendInfo:
    LSApplicationCategoryType: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Development
